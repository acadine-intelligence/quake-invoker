wait 120
screenshot empty
orb q
wait 8
orb w
wait 8
orb e
wait 60
screenshot colors
orb w
wait 8
orb q
wait 8
orb w
wait 30
invoke
wait 36
screenshot rocket_cast
invswap
wait 12
screenshot swapped_left
wait 75
screenshot rocket_ready
orb w
wait 8
orb w
wait 8
orb q
wait 30
invoke
wait 36
screenshot lightning_cast
wait 75
screenshot dual_before
+button12
wait 8
-button12
wait 15
screenshot left_fired
+button13
wait 15
screenshot right_firing
-button13
wait 15
screenshot both_after
orb q
wait 8
orb q
wait 8
orb e
wait 30
invoke
wait 20
screenshot spell_attempt
