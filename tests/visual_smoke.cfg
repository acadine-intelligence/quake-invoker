// Run through activeAction, after map loading. Each wait counts frames.
exec invoker.cfg
set com_maxfps 60
set cg_drawFPS 1
set cg_drawTimer 0
set cg_invokeEffects 1
set cg_thirdPerson 0
wait 120
screenshot empty
orb q
wait 8
orb w
wait 8
orb e
wait 60
screenshot colors
orb q
wait 8
orb q
wait 8
orb e
wait 30
invoke
wait 36
screenshot frost_cast
wait 75
screenshot frost_ready
orb w
wait 8
orb w
wait 8
orb e
wait 30
invoke
wait 36
screenshot storm_cast
wait 75
set cg_invokeEffects 0
wait 10
screenshot effects_off
set cg_invokeEffects 1
team spectator
wait 90
screenshot spectator
wait 900
team free
wait 90
screenshot respawn
condump visual-console.txt
quit
