// mana reset: cold snap (35) and ice wall (40) share one pool, and
// frame-based waits make regen timing vary with frame rate. A spectator
// round-trip respawns the player, filling the pool to 100 deterministically.
// The first wait must clear the server's 5-second team-switch cooldown even
// at the tail's high frame rate (1800 frames >= 5 s up to 360 fps).
