// Opt-in Quake Invoker movement-orb and dual-hand controls.
// The +inv* half records physical key edges; held-key autorepeat adds no orbs.
bind w "+forward; +invw"
bind a "+moveleft; +inva"
bind s "+back; +invs"
bind d "+moveright; +invd"
bind r "invoke"
bind t "invswap"
bind MOUSE1 "+button12"
bind MOUSE2 "+button13"
seta cg_invokeEffects 1
