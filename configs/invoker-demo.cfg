// Optional two-weapon demo. Run after the player enters the map.
// Recipes are order-sensitive: W,Q,W is the Rocket Launcher and W,W,Q the
// Lightning Gun (see docs/design/04-ordered-spells.md).
exec invoker.cfg
wait 20
orb w
wait 6
orb q
wait 6
orb w
wait 6
invoke
wait 12
invswap
wait 12
orb w
wait 6
orb w
wait 6
orb q
wait 6
invoke
